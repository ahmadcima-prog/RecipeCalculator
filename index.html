<!DOCTYPE html>
<html lang="en">

<head>
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png?v=2">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Management</title>

    <style>
/* Same style as static/css/style.css */
:root {
    color-scheme: light;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.top-header {
    background: #1f2937;
    color: white;
    padding: 16px 20px 22px;
    text-align: center;
}

.arabic-title {
    direction: rtl;
}

.logout-button {
    display: inline-block;
    width: auto;
    padding: 9px 16px;
    background: #dc2626;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    cursor: pointer;
}

.logout-button:hover {
    background: #b91c1c;
}

.user-area {
    max-width: 1100px;
    margin: 0 auto 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    text-align: left;
    /* Keep user info left / buttons right in Arabic (RTL) too. */
    direction: ltr;
}

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #f3f4f6;
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
}

.login-header {
    text-align: center;
    margin-bottom: 25px;
}

.login-header h1 {
    color: #1f2937;
}

.login-header p {
    margin: 5px 0 0;
}

.login-card button {
    margin-top: 20px;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

h1 {
    margin: 5px 0;
}

h2 {
    margin-top: 0;
}

h3 {
    margin-top: 25px;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input,
select,
button {
    width: 100%;
    padding: 11px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #1d4ed8;
}

button.secondary {
    background: #6b7280;
}

button.secondary:hover {
    background: #4b5563;
}

.company-card {
    border-left: 5px solid #2563eb;
}

.company-title {
    font-size: 26px;
    font-weight: bold;
}

.arabic {
    direction: rtl;
    font-size: 20px;
    margin-top: 5px;
}

.recipe-details {
    margin-top: 20px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

.recipe-management-table {
    table-layout: fixed;
}

.recipe-management-table th:nth-child(1),
.recipe-management-table th:nth-child(2),
.recipe-management-table th:nth-child(3),
.recipe-management-table td:nth-child(1),
.recipe-management-table td:nth-child(2),
.recipe-management-table td:nth-child(3) {
    width: 22%;
}

.recipe-management-table th:nth-child(4),
.recipe-management-table td:nth-child(4) {
    width: 12%;
}

.recipe-management-table th:nth-child(5),
.recipe-management-table td:nth-child(5) {
    width: 22%;
}

.recipe-management-table td {
    overflow-wrap: anywhere;
    vertical-align: top;
}

th,
td {
    border: 1px solid #ddd;
    padding: 10px;
    /* "start" = left in English (LTR), right in Arabic (RTL) */
    text-align: start;
}

th {
    background: #e5e7eb;
}

.message {
    padding: 12px;
    margin-top: 15px;
    border-radius: 6px;
    background: #dcfce7;
    color: #166534;
}

.message.error {
    background: #fee2e2;
    color: #991b1b;
}

.hidden {
    display: none;
}

.recipe-summary h3 {
    margin-top: 0;
}

.recipe-production-calculator {
    margin-top: 20px;
    padding: 16px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
}

.recipe-production-calculator .calculator-row {
    display: flex;
    gap: 10px;
    align-items: end;
    margin-top: 10px;
}

.recipe-production-calculator .calculator-input-wrap {
    flex: 0 0 180px;
    min-width: 140px;
}

.recipe-production-calculator .calculator-button {
    flex: 0 0 auto;
    width: auto;
    margin-top: 0;
    padding: 10px 16px;
    min-width: 110px;
}

.lang-switch{width:auto;margin:0;padding:9px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lang-switch:hover{background:#1d4ed8}
.lang-switch-float{position:fixed;top:18px;right:18px;z-index:99}
@media (max-width: 600px) {
    .container {
        margin: 10px;
        padding: 5px;
    }

    .card {
        padding: 15px;
    }

    table {
        font-size: 14px;
    }

    th,
    td {
        padding: 8px 6px;
    }

    .recipe-production-calculator .calculator-row {
        flex-direction: column;
        align-items: stretch;
    }

    .recipe-production-calculator .calculator-input-wrap {
        flex: 1 1 auto;
    }

    .recipe-production-calculator .calculator-button {
        width: 100%;
    }
    /* --- Compact header, buttons and company card for small screens --- */
    .top-header {
        padding: 10px 12px 12px;
    }

    .topbar > div:first-child h1 {
        display: inline;
        font-size: 16px;
        margin: 0;
    }

    .arabic-title {
        display: inline;
        margin-inline-start: 10px;
        font-size: 13px;
        color: #cbd5e1;
    }

    .user-area-inner {
        margin-top: 8px !important;
        gap: 8px !important;
        font-size: 13px;
    }

    .user-area-inner > div {
        gap: 6px !important;
    }

    .lang-switch,
    .logout-button {
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 5px;
    }

    .login-header h1 {
        font-size: 18px;
        margin: 0;
    }

    .login-header p {
        margin: 4px 0 0;
        font-size: 13px;
    }

    .company-card h2 {
        font-size: 16px;
        margin-bottom: 6px;
    }

    .company-title {
        display: inline;
        font-size: 15px;
    }

    .company-card .arabic {
        display: inline;
        margin-inline-start: 8px;
        font-size: 13px;
    }
}
    </style>
</head>

<body class="login-page">

<!-- LOGIN VIEW -->
<div id="loginView">

    <button type="button" class="lang-switch lang-switch-float" onclick="toggleLang()">العربية</button>

    <div class="login-card">

        <div class="login-header">
            <h1>Recipe System</h1>
            <p>نظام الوصفات</p>
        </div>

        <form id="loginForm">
            <label for="username" data-i18n="user">
                User
            </label>

            <select id="username" required>

                <option value="" data-i18n="select_user">
                    Select User
                </option>

            </select>

            <label for="password" data-i18n="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                data-i18n-ph="enter_password"
                autocomplete="current-password"
                required
            >

            <button type="submit" data-i18n="login">
                Login / دخول
            </button>

            <div id="loginMessage" class="message hidden"></div>
        </form>

    </div>

</div>


<!-- MAIN APP (hidden until login) -->
<header class="top-header hidden" id="appHeader">

    <div class="topbar">

        <div>
            <h1>Recipe Management</h1>
            <div class="arabic-title">إدارة الوصفات</div>
        </div>

        <div class="user-area-inner" style="display:flex;justify-content:space-between;align-items:center;gap:15px;direction:ltr;">
            <span>
                User:
                <strong id="displayUsername"></strong>
            </span>

            <div style="display:flex;align-items:center;gap:10px;">
                <button type="button" class="lang-switch" id="langSwitch" onclick="toggleLang()">العربية</button>
                <a href="#" class="logout-button" onclick="logout(); return false;">
                    Logout / خروج
                </a>
            </div>
        </div>

    </div>

</header>


<div class="container hidden" id="appContainer">


    <!-- =====================================================
         COMPANY INFORMATION
         ===================================================== -->

    <div class="card company-card">

        <h2 data-i18n="company">🏢 Company</h2>

        <div id="companyInformation"></div>

    </div>


    <!-- =====================================================
         RECIPE SELECTION
         ===================================================== -->

    <div class="card">

        <h2 data-i18n="recipes">📋 Recipes</h2>

        <label for="recipeSelect" data-i18n="select_recipe">
            Select Recipe
        </label>

        <select id="recipeSelect" onchange="loadRecipe()">

            <option value="" data-i18n="select_recipe">
                Select Recipe
            </option>

        </select>

        <div id="recipeDetails"></div>

    </div>


    <!-- =====================================================
         RECIPE DETAILS
         ===================================================== -->

    <div
        id="recipeDetailsCard"
        class="card"
        style="display:none;"
    >

        <h2 data-i18n="recipe_details">Recipe Details</h2>

        <div id="recipeDetailsContent"></div>

    </div>


</div>

function t(key) {
    var entry = I18N[key];
    if (!entry) { return key; }
    return entry[LANG] || entry.en;
}


// Show the name matching the selected language.

function nameByLang(nameEn, nameAr) {
    return LANG === "ar"
        ? (nameAr || nameEn || "")
        : (nameEn || nameAr || "");
}


// Show units per language. Supports the "Kg / كيلو" format.

function unitText(unit) {
    var value = String(unit || "").trim();

    if (value.indexOf("/") !== -1) {
        var parts = value.split("/");
        return LANG === "ar"
            ? (parts[1] || parts[0]).trim()
            : parts[0].trim();
    }

    // Translate the standard units in Arabic mode.

    if (LANG === "ar") {
        var standardUnits = {
            "kg": "كجم",
            "g": "جرام",
            "gram": "جرام",
            "liter": "لتر",
            "litre": "لتر",
            "pcs": "حبة",
            "piece": "حبة"
        };

        var key = value.toLowerCase();

        if (standardUnits[key]) {
            return standardUnits[key];
        }
    }

    return value;
}

// =========================================================
// SMART UNIT CONVERSION (gm <-> Kg, ml <-> Ltr)
// (same as static/css/script.js)
// =========================================================

// English storage key of a unit ("Gram / جرام" -> "gram").

function unitKey(unit) {
    const value = String(unit || "").trim();
    const englishPart = value.indexOf("/") !== -1
        ? value.split("/")[0].trim()
        : value;
    return englishPart.toLowerCase();
}

// Decide the best unit to display a quantity in:
// 1000+ gm -> Kg, 1000+ ml -> Ltr, below 1 Kg -> gm and
// below 1 Ltr -> ml. Everything else stays unchanged.

function smartDisplay(quantity, unit) {

    const value = Number(quantity) || 0;
    const key = unitKey(unit);

    const massSmall = ["g", "gm", "gram", "grams"];
    const volumeSmall = ["ml", "milliliter", "millilitre"];
    const massLarge = ["kg", "kgs", "kilogram", "kilograms"];
    const volumeLarge = ["l", "ltr", "liter", "litre", "liters", "litres"];

    if (massSmall.indexOf(key) !== -1 && value >= 1000) {
        return { value: value / 1000, unit: "Kg / كجم" };
    }

    if (volumeSmall.indexOf(key) !== -1 && value >= 1000) {
        return { value: value / 1000, unit: "Ltr / لتر" };
    }

    if (massLarge.indexOf(key) !== -1 && value > 0 && value < 1) {
        return { value: value * 1000, unit: "gm / جم" };
    }

    if (volumeLarge.indexOf(key) !== -1 && value > 0 && value < 1) {
        return { value: value * 1000, unit: "ml / مل" };
    }

    return { value: value, unit: String(unit || "").trim() };

}

// Format a quantity with at most two decimal places ("4.673" ->
// "4.67", "100" stays "100"). Same behavior as static/css/script.js.

function formatQuantity(value) {

    const fixed = Number(value || 0).toFixed(2);

    return fixed.indexOf(".") !== -1
        ? fixed.replace(/0+$/, "").replace(/\.$/, "")
        : fixed;

}

function getSavedLang() {
    try {
        return localStorage.getItem("calcLang") || "en";
    } catch (e) {
        return "en";
    }
}

function saveLang(lang) {
    try {
        localStorage.setItem("calcLang", lang);
    } catch (e) { /* ignore */ }
}

function applyLang() {
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = t(el.dataset.i18n);
    });

    document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
        el.placeholder = t(el.dataset.i18nPh);
    });

    document.querySelectorAll(".lang-switch").forEach(function (btn) {
        btn.textContent = LANG === "en" ? "🌐 العربية" : "🌐 English";
    });
}

function toggleLang() {
    LANG = LANG === "en" ? "ar" : "en";
    saveLang(LANG);
    location.reload();
}



// =========================================================
// COMMON HELPERS  (same as static/css/script.js)
// =========================================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

}


function showMessage(elementId, text, isError) {

    const element = document.getElementById(elementId);

    if (!element) {
        return;
    }

    element.textContent = text;

    element.classList.remove("hidden");
    element.classList.toggle("error", Boolean(isError));

}


function calculateYieldPercentage(inputQuantity, outputQuantity) {

    const input = Number(inputQuantity);
    const output = Number(outputQuantity);

    if (!input || input <= 0 || !output || output < 0) {
        return "0.00";
    }

    return formatQuantity(output / input * 100);

}


function calculateProductionScale(targetQuantity, standardOutput) {

    const target = Number(targetQuantity);
    const standard = Number(standardOutput);

    if (!target || target <= 0 || !standard || standard <= 0) {
        return null;
    }

    return target / standard;

}

// LOGIN  (same as login page in the Flask app)
// =========================================================

var currentUser = null;

var selectedCompanyId = null;


function initLoginPage() {

    const usernameSelect =
        document.getElementById("username");

    const loginForm =
        document.getElementById("loginForm");

    usernameSelect.innerHTML =
        '<option value="">' + t("select_user") + '</option>';

    DATA.users.forEach(function (user) {

        const option =
            document.createElement("option");

        option.value =
            user.username;

        option.textContent =
            user.username;

        usernameSelect.appendChild(option);

    });

    loginForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const user = DATA.users.filter(function (u) {
                return u.username === username;
            })[0];

            if (!user || user.password !== password) {
                showMessage(
                    "loginMessage",
                    t("invalid_login"),
                    true
                );
                return;
            }

            showMessage("loginMessage", "");

            currentUser = user;

            selectedCompanyId = user.company_id;

            enterApp();

        }
    );

}


function enterApp() {

    document.body.classList.remove("login-page");

    document.getElementById("loginView").classList.add("hidden");

    document.getElementById("appHeader").classList.remove("hidden");

    document.getElementById("appContainer").classList.remove("hidden");

    document.getElementById("displayUsername").textContent =
        currentUser.username;

    document.getElementById("password").value = "";

    initPage();

}


function logout() {

    currentUser = null;

    selectedCompanyId = null;

    document.getElementById("recipeSelect").value = "";

    document.getElementById("recipeDetailsCard").style.display = "none";

    document.getElementById("recipeDetailsContent").innerHTML = "";

    document.getElementById("recipeDetails").innerHTML = "";

    document.getElementById("appHeader").classList.add("hidden");

    document.getElementById("appContainer").classList.add("hidden");

    document.getElementById("loginView").classList.remove("hidden");

    document.getElementById("password").value = "";

    document.getElementById("loginMessage").classList.add("hidden");

    document.body.classList.add("login-page");

}


// =========================================================
// RECIPE SELECTION  (filtered by the logged-in user's company)
// =========================================================

function initPage() {

    const recipeSelect =
        document.getElementById("recipeSelect");

    const companyInformation =
        document.getElementById("companyInformation");

    // Only the logged-in user's company recipes are shown.
    // Admin (no company) sees all companies.

    let visibleRecipes = DATA.recipes;

    let visibleCompanies = DATA.companies;

    if (currentUser && currentUser.role !== "admin" && currentUser.company_id) {

        visibleRecipes = DATA.recipes.filter(function (r) {
            return r.company_id === currentUser.company_id;
        });

        visibleCompanies = DATA.companies.filter(function (c) {
            return c.id === currentUser.company_id;
        });

    }

    // Mirror the server permission rules: if the user has at least one
    // explicitly permitted recipe, show only those; otherwise all
    // company recipes remain visible.
    if (currentUser && currentUser.permissions
            && currentUser.permissions.length > 0) {

        visibleRecipes = visibleRecipes.filter(function (r) {
            return currentUser.permissions.indexOf(r.id) !== -1;
        });

    }

    let html = "";

    visibleCompanies.forEach(function (company) {

        html +=
            '<div class="company-title">' +
                escapeHtml(company.name_en) +
            '</div>' +
            '<div class="arabic">' +
                escapeHtml(company.name_ar) +
            '</div>';

    });

    companyInformation.innerHTML = html;

    recipeSelect.innerHTML =
        '<option value="">Select Recipe</option>';

    buildRecipeGroups(visibleRecipes, recipeSelect);

}


// =========================================================
// CATEGORY GROUPS (dropdown + tappable list)
// Recipes are grouped under their category; recipes without
// a category fall under "Other".
// =========================================================

function buildRecipeGroups(recipes, select) {

    const cats = {};

    (DATA.categories || []).forEach(function (c) {
        cats[c.id] = c;
    });

    const groups = {};
    const order = [];

    recipes.forEach(function (recipe) {

        const cat = cats[recipe.category_id];
        const key = cat ? "c" + cat.id : "other";

        if (!groups[key]) {
            groups[key] = {
                label: cat
                    ? nameByLang(cat.name_en, cat.name_ar)
                    : nameByLang("Other", "أخرى"),
                recipes: []
            };
            order.push(key);
        }

        groups[key].recipes.push(recipe);

    });

    // Dropdown with <optgroup> per category.
    order.forEach(function (key) {

        const group = document.createElement("optgroup");
        group.label = groups[key].label;

        groups[key].recipes.forEach(function (recipe) {

            const option =
                document.createElement("option");

            option.value =
                recipe.id;

            option.textContent =
                nameByLang(recipe.name_en, recipe.name_ar);

            group.appendChild(
                option
            );

        });

        select.appendChild(
            group
        );

    });

}

function loadRecipe() {

    const recipeId =
        document.getElementById("recipeSelect").value;


    document.getElementById("recipeDetailsCard").style.display = "none";

    document.getElementById("recipeDetailsContent").innerHTML = "";


    if (!recipeId) {
        return;
    }


    const recipe = DATA.recipes.filter(function (r) {
        return String(r.id) === String(recipeId);
    })[0];


    if (!recipe) {
        return;
    }


    renderRecipe(recipe);

}

// (same as script.js user mode)
// =========================================================

function updateProductionInputMode(recipeId) {

    const baseIngredientSelect = document.getElementById(
        "recipeBaseIngredient-" + recipeId
    );

    const label = document.getElementById(
        "recipeTargetLabel-" + recipeId
    );

    const input = document.getElementById(
        "recipeTargetOutput-" + recipeId
    );

    const option =
        baseIngredientSelect &&
        baseIngredientSelect.selectedOptions[0];

    const unit = option ? option.dataset.unit : "";

    if (option && option.value) {
        label.textContent = t("qty_for") + " " + option.textContent;
        input.placeholder = t("enter_qty_in") + (unit ? " " + unit : "");
    }
    else {
        label.textContent = t("qty_produce");
        input.placeholder = t("enter_qty_produce");
    }

}


function onTargetOutputInput(recipeId) {

    const targetInput = document.getElementById(
        "recipeTargetOutput-" + recipeId
    );

    // When the "quantity to produce" box is emptied, bring back
    // the standard recipe quantities.
    if (targetInput && targetInput.value.trim() === "") {
        clearUserProduction(recipeId);
    }

}


function calculateUserProduction(recipeId) {

    const baseIngredientSelect = document.getElementById(
        "recipeBaseIngredient-" + recipeId
    );

    const targetInput = document.getElementById(
        "recipeTargetOutput-" + recipeId
    );

    const resultBox = document.getElementById(
        "recipeProductionResult-" + recipeId
    );

    if (!targetInput || !resultBox) {
        return;
    }

    const selectedBaseOption =
        baseIngredientSelect &&
        baseIngredientSelect.selectedOptions[0];

    const hasBaseIngredient = Boolean(
        selectedBaseOption && selectedBaseOption.value
    );

    let scale;
    const targetQuantity = Number(targetInput.value);

    if (hasBaseIngredient) {
        const standardBaseQuantity = Number(
            selectedBaseOption.dataset.standardQuantity
        );

        scale = calculateProductionScale(
            targetQuantity,
            standardBaseQuantity
        );
    }
    else {
        const standardOutput = Number(targetInput.dataset.standardOutput);

        scale = calculateProductionScale(
            targetQuantity,
            standardOutput
        );
    }

    if (scale === null) {
        showMessage(
            "recipeProductionResult-" + recipeId,
            t("invalid_qty_msg"),
            true
        );
        return;
    }

    const ingredientRows = document.querySelectorAll(
        ".user-calculated-qty[data-recipe-id='" + recipeId + "']"
    );

    ingredientRows.forEach(function (row) {
        const tr = row.closest("tr");
        const qtyCell = tr ? tr.querySelector(".qty-cell") : null;
        const standardQuantity = Number(
            row.dataset.standardQuantity
        );
        const unit = row.dataset.standardUnit || "";
        const calculatedQuantity = standardQuantity * scale;

        const isSelectedBase =
            hasBaseIngredient &&
            row.dataset.ingredientId === selectedBaseOption.value;

        const rawValue = isSelectedBase
            ? targetQuantity
            : calculatedQuantity;

        // Smart unit display: 1000+ gm -> Kg, 1000+ ml -> Ltr,
        // and back below one Kg / Ltr.
        const smart = smartDisplay(rawValue, unit);
        const displayValue = formatQuantity(smart.value);

        // The Calculated Quantity column shows the number only;
        // the unit (original or converted, e.g. Ltr -> ml) goes
        // in the Unit column.
        if (qtyCell) {
            qtyCell.textContent = displayValue;
        }

        const unitCell = tr ? tr.querySelector(".unit-cell") : null;

        if (unitCell) {
            unitCell.textContent = unitText(smart.unit);
        }

        // The separate "Calculated Quantity" column stays hidden.
        row.textContent = displayValue + " " + unitText(smart.unit || unit);
        row.closest(".calculated-quantity-cell").classList.add("hidden");
    });

    // Swap the column label: Quantity -> Calculated Quantity.
    const quantityHeader = document.getElementById(
        "quantityHeader-" + recipeId
    );
    if (quantityHeader) {
        quantityHeader.textContent = t("col_calc_qty");
    }

    document.getElementById(
        "calculatedQuantityHeader-" + recipeId
    ).classList.add("hidden");

    showMessage(
        "recipeProductionResult-" + recipeId,
        t("scaling_msg") + " " +
            Number(scale * 100).toFixed(2) + "%."
    );

}


function clearUserProduction(recipeId) {

    const baseIngredientSelect = document.getElementById(
        "recipeBaseIngredient-" + recipeId
    );

    const targetInput = document.getElementById(
        "recipeTargetOutput-" + recipeId
    );

    const resultBox = document.getElementById(
        "recipeProductionResult-" + recipeId
    );

    if (targetInput) {
        targetInput.value = "";
    }

    if (baseIngredientSelect) {
        baseIngredientSelect.value = "";
        updateProductionInputMode(recipeId);
    }

    document.querySelectorAll(
        ".user-calculated-qty[data-recipe-id='" + recipeId + "']"
    ).forEach(function (row) {
        const tr = row.closest("tr");
        const qtyCell = tr ? tr.querySelector(".qty-cell") : null;
        const unitCell = tr ? tr.querySelector(".unit-cell") : null;

        row.textContent = "";
        row.closest(".calculated-quantity-cell").classList.add("hidden");

        // Restore the standard recipe quantity (with smart
        // unit display: gm -> Kg, ml -> Ltr): number in the
        // quantity column, unit in the Unit column.
        const smart = smartDisplay(
            row.dataset.standardQuantity,
            row.dataset.standardUnit || ""
        );

        if (qtyCell) {
            qtyCell.textContent = formatQuantity(smart.value);
        }

        if (unitCell) {
            unitCell.textContent = unitText(smart.unit);
        }
    });

    // Swap the column label back: Calculated Quantity -> Quantity.
    const quantityHeader = document.getElementById(
        "quantityHeader-" + recipeId
    );
    if (quantityHeader) {
        quantityHeader.textContent = t("col_quantity");
    }

    document.getElementById(
        "calculatedQuantityHeader-" + recipeId
    ).classList.add("hidden");

    if (resultBox) {
        resultBox.classList.add("hidden");
        resultBox.classList.remove("error");
    }

}
